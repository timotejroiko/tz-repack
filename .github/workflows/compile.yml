name: Compile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:

  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/checkout@v7

      - name: lzip
        run: sudo apt install -y lzip

      - id: check
        name: check
        run: node build.js | tee out.txt; echo "RESULT=$(tail out.txt -n 1)" >> $GITHUB_OUTPUT; rm out.txt

      - name: commit
        if: steps.check.outputs.RESULT == 'Done'
        uses: stefanzweifel/git-auto-commit-action@v7

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compile.yml/enable" --silent; then
              echo "keepalive ok (attempt $i)"
              exit 0
            fi
            echo "keepalive attempt $i failed, retrying..."
            sleep 10
          done
          echo "keepalive failed after 3 attempts"
          exit 1
