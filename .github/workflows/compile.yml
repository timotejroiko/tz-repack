name: Compile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:

  update:
    name: Update
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build latest timezone data
        run: node build.js

      - name: Validate published timezone data
        run: npm test

      - name: Prepare commit message
        id: commit
        run: |
          iana=$(node -p "require('./build/IANA/latest.json').version")
          gtz=$(node -p "require('./build/GTZ/latest.json').version")
          echo "message=Update timezone data: IANA $iana, GTZ $gtz" >> "$GITHUB_OUTPUT"

      - name: Commit validated timezone data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: build/IANA/*.json build/GTZ/*.json
          commit_message: ${{ steps.commit.outputs.message }}

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compile.yml/enable" --silent; then
              echo "keepalive ok (attempt $i)"
              exit 0
            fi
            echo "keepalive attempt $i failed, retrying..."
            sleep 10
          done
          echo "keepalive failed after 3 attempts"
          exit 1
