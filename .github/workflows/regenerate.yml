name: Regenerate timezone data (2022+)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Regenerate upstream releases from 2022 onward
        env:
          GH_TOKEN: ${{ github.token }}
        run: node regenerate.js

      - name: Validate published timezone data
        run: npm test

      - name: Prepare release metadata
        id: prepare
        run: |
          version=$(node -p "require('./package.json').version")
          iana=$(node -p "require('./build/IANA/latest.json').version")
          gtz=$(node -p "require('./build/GTZ/latest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "iana=$iana" >> "$GITHUB_OUTPUT"
          echo "gtz=$gtz" >> "$GITHUB_OUTPUT"
          echo "message=Update timezone data: IANA $iana, GTZ $gtz" >> "$GITHUB_OUTPUT"

      - name: Commit validated timezone data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: package.json build/IANA/*.json build/GTZ/*.json
          commit_message: ${{ steps.prepare.outputs.message }}

      - name: Publish GitHub release
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          IANA: ${{ steps.prepare.outputs.iana }}
          GTZ: ${{ steps.prepare.outputs.gtz }}
          COMMIT: ${{ steps.commit.outputs.commit_hash }}
        run: |
          gh release create "v$VERSION" \
            --target "$COMMIT" \
            --title "$VERSION — IANA $IANA / GTZ $GTZ" \
            --generate-notes
